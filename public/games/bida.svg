<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <radialGradient id="eightGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <radialGradient id="cueGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <!-- Billiard Table Background Shape -->
  <rect x="4" y="8" width="56" height="48" rx="8" fill="#047857" stroke="#065f46" stroke-width="2.5" />
  
  <!-- Table Pockets -->
  <circle cx="8" cy="12" r="3" fill="#18181b" />
  <circle cx="56" cy="12" r="3" fill="#18181b" />
  <circle cx="8" cy="52" r="3" fill="#18181b" />
  <circle cx="56" cy="52" r="3" fill="#18181b" />
  <circle cx="32" cy="11" r="2.5" fill="#18181b" />
  <circle cx="32" cy="53" r="2.5" fill="#18181b" />

  <!-- 8-Ball -->
  <circle cx="38" cy="30" r="8" fill="url(#eightGrad)" />
  <circle cx="38" cy="30" r="3.5" fill="#ffffff" />
  <text x="38" y="32.5" text-anchor="middle" font-size="5" font-weight="900" fill="#18181b" font-family="sans-serif">8</text>

  <!-- Solid Blue Ball -->
  <circle cx="48" cy="38" r="6.5" fill="url(#ballGrad)" />
  <circle cx="46" cy="36" r="1.5" fill="#ffffff" opacity="0.6" />

  <!-- Cue Ball (White) -->
  <circle cx="20" cy="36" r="7.5" fill="url(#cueGrad)" />
  <circle cx="18" cy="34" r="2" fill="#ffffff" opacity="0.8" />

  <!-- Cue Stick aiming at White Ball -->
  <line x1="6" y1="48" x2="15" y2="40" stroke="url(#stickGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="14" y1="41" x2="16" y2="39" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
</svg>