<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ez-bg" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Vibrant Electric Blue to Cyan Gradient for 'E' and 'Z' -->
    <linearGradient id="ez-bolt" x1="28" y1="28" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Accent Coral/Rose Gradient -->
    <linearGradient id="ez-coral" x1="80" y1="36" x2="104" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="ez-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#ez-bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="30" stroke="#27272a" stroke-width="1.5"/>

  <!-- Subtle Precision Grid Points -->
  <circle cx="32" cy="32" r="1.5" fill="#3f3f46"/>
  <circle cx="96" cy="32" r="1.5" fill="#3f3f46"/>
  <circle cx="32" cy="96" r="1.5" fill="#3f3f46"/>
  <circle cx="96" cy="96" r="1.5" fill="#3f3f46"/>

  <!-- Iconic Lightning-Fold Game Monogram ('E' + 'Z' fused into a Game Controller / Thunderbolt) -->
  <path
    d="M 40 38 L 86 38 C 90 38 92 42 89 45 L 62 72 L 86 72 C 90 72 92 76 89 79 L 52 100 C 47 103 44 98 47 94 L 58 78 L 42 78 C 38 78 36 74 39 71 L 64 46 L 42 46 C 38 46 38 38 40 38 Z"
    fill="url(#ez-bolt)"
    filter="url(#ez-glow)"
  />

  <!-- Gaming Accent Spark (Player Duel Node) -->
  <circle cx="92" cy="40" r="5" fill="url(#ez-coral)"/>
</svg>
